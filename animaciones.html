<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Neo-Animator</title>

<style>
:root{
--bg:#071018;
--app:#0d1722;
--panel:#13202d;
--box:#0d1720;
--soft:#091119;

--text:#ffffff;
--sub:#8ea7b5;

--accent1:#00ffb3;
--accent2:#00c6ff;
--accent3:#0066ff;

--shadow:
0 0 40px rgba(0,255,179,.08),
0 0 80px rgba(0,198,255,.08);

--border:rgba(255,255,255,.05);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
}

body{
background:
radial-gradient(circle at top left,#00ffb322,transparent 30%),
radial-gradient(circle at bottom right,#0066ff22,transparent 30%),
var(--bg);

height:100vh;
overflow:hidden;
padding:20px;
color:var(--text);
}

.app{
width:100%;
height:100%;
background:
linear-gradient(
145deg,
var(--app),
#09131d
);

border-radius:35px;
padding:25px;
display:flex;
flex-direction:column;
gap:20px;
box-shadow:var(--shadow);
border:1px solid var(--border);
}

.header{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:10px;
}

.logo{
width:95px;
height:95px;
border-radius:30px;

}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

.titulo{
font-size:44px;
font-weight:bold;
background:
linear-gradient(
90deg,
var(--accent1),
var(--accent2)
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.sub{
opacity:.7;
font-size:15px;
}

.content{
flex:1;
display:flex;
gap:20px;
overflow:hidden;
}

.panel{
width:430px;
background:
linear-gradient(
180deg,
var(--panel),
#0d1722
);

border-radius:30px;
padding:20px;
display:flex;
flex-direction:column;
gap:18px;
overflow:auto;
border:1px solid var(--border);
}

.box{
background:
linear-gradient(
180deg,
var(--box),
#091119
);

padding:18px;
border-radius:22px;
display:flex;
flex-direction:column;
gap:14px;
border:1px solid rgba(255,255,255,.04);
}

label{
font-size:14px;
opacity:.8;
}

select,
input[type="range"]{
width:100%;
}

select{
background:var(--soft);
border:none;
outline:none;
padding:15px;
border-radius:16px;
color:#fff;
font-size:15px;
border:1px solid rgba(0,255,179,.06);
}

.rangeValue{
font-size:13px;
opacity:.7;
}

.previewZone{
flex:1;
display:flex;
flex-direction:column;
gap:20px;
}

.preview{
flex:1;
background:
linear-gradient(
145deg,
#071018,
#111c28
);

border-radius:35px;
display:flex;
justify-content:center;
align-items:center;
position:relative;
overflow:hidden;
border:1px solid rgba(255,255,255,.04);
}

.preview::after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(45deg,#ffffff08 25%,transparent 25%),
linear-gradient(-45deg,#ffffff08 25%,transparent 25%);
background-size:40px 40px;
opacity:.12;
pointer-events:none;
}

.object{
width:140px;
height:140px;
border-radius:35px;
background:
linear-gradient(
135deg,
var(--accent1),
var(--accent2),
var(--accent3)
);

box-shadow:
0 0 25px rgba(0,255,179,.18),
0 0 50px rgba(0,198,255,.14);

transition:.3s;
}

textarea{
width:100%;
height:260px;
resize:none;
border:none;
outline:none;
border-radius:22px;
padding:18px;
background:var(--soft);
color:#00ffbf;
line-height:1.6;
font-size:14px;
}

.buttons{
display:flex;
gap:12px;
}

button{
flex:1;
border:none;
padding:16px;
border-radius:18px;
cursor:pointer;
font-weight:bold;
font-size:15px;
color:#fff;
transition:.2s;
}

button:hover{
transform:translateY(-2px);
}

.play{
background:
linear-gradient(
45deg,
var(--accent1),
var(--accent2)
);
}

.copy{
background:
linear-gradient(
45deg,
var(--accent2),
var(--accent3)
);
}

.presets{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.preset{
background:var(--soft);
padding:14px;
border-radius:16px;
cursor:pointer;
text-align:center;
transition:.2s;
border:1px solid rgba(255,255,255,.04);
}

.preset:hover{
transform:scale(1.03);
border-color:rgba(0,255,179,.25);

box-shadow:
0 0 20px rgba(0,255,179,.08);
}

::-webkit-scrollbar{
width:6px;
}

::-webkit-scrollbar-thumb{
background:
linear-gradient(
var(--accent1),
var(--accent3)
);

border-radius:20px;
}
</style>
<link rel="icon" href="neoanimator.png" sizes="192x192">
</head>
<body>

<div class="app">

<div class="header">

<div class="logo">
	<img src="logo.png" class="logo">
</div>

<div class="titulo">
Neo-Animator
</div>

<div class="sub">
Generador visual de animaciones CSS
</div>

</div>

<div class="content">

<div class="panel">

<div class="box">

<label>Animación</label>

<select id="animation">

<option value="float">Float</option>
<option value="pulse">Pulse</option>
<option value="rotate">Rotate</option>
<option value="bounce">Bounce</option>
<option value="shake">Shake</option>
<option value="flip">Flip</option>
<option value="scale">Scale</option>

</select>

</div>

<div class="box">

<label>Duración</label>

<input type="range" id="duration" min="1" max="10" value="3">

<div class="rangeValue">
<span id="durationText">3s</span>
</div>

</div>

<div class="box">

<label>Delay</label>

<input type="range" id="delay" min="0" max="5" value="0" step=".1">

<div class="rangeValue">
<span id="delayText">0s</span>
</div>

</div>

<div class="box">

<label>Iteraciones</label>

<select id="iteration">

<option value="infinite">Infinite</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="5">5</option>

</select>

</div>

<div class="box">

<label>Easing</label>

<select id="easing">

<option value="ease">Ease</option>
<option value="linear">Linear</option>
<option value="ease-in">Ease In</option>
<option value="ease-out">Ease Out</option>
<option value="ease-in-out">Ease In Out</option>

</select>

</div>

<div class="box">

<label>Presets rápidos</label>

<div class="presets">

<div class="preset" data-animation="float">
Float
</div>

<div class="preset" data-animation="pulse">
Pulse
</div>

<div class="preset" data-animation="rotate">
Rotate
</div>

<div class="preset" data-animation="bounce">
Bounce
</div>

<div class="preset" data-animation="shake">
Shake
</div>

<div class="preset" data-animation="flip">
Flip
</div>

</div>

</div>



<div class="buttons">

<button class="play" id="play">
Reproducir
</button>

<button class="copy" id="copy">
Copiar
</button>

</div>

</div>

<div class="previewZone">

<div class="preview">

<div class="object" id="object"></div>

</div>

</div>

</div>

</div>
<script>
let object=document.getElementById("object");

let animation=document.getElementById("animation");

let duration=document.getElementById("duration");
let durationText=document.getElementById("durationText");

let delay=document.getElementById("delay");
let delayText=document.getElementById("delayText");

let iteration=document.getElementById("iteration");

let easing=document.getElementById("easing");

let code=document.getElementById("code");

let play=document.getElementById("play");

let copy=document.getElementById("copy");

let dynamicStyle=document.createElement("style");

document.head.appendChild(dynamicStyle);

let rawCSS="";

const animations=[

"float",
"pulse",
"rotate",
"bounce",
"shake",
"flip",
"scale",
"swing",
"wiggle",
"heartbeat",
"slideLeft",
"slideRight",
"slideUp",
"slideDown",
"zoomIn",
"zoomOut",
"blurIn",
"glow",
"tilt",
"spinScale",
"elastic",
"floatRotate",
"neonPulse",
"skew",
"wave",
"fadeIn",
"fadeOut",
"matrix",
"portal",
"levitate"

];

animation.innerHTML="";

animations.forEach(a=>{

animation.innerHTML+=`
<option value="${a}">
${a}
</option>
`;

});

function getKeyframes(name){

if(name=="float"){
return `
@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-40px);}
100%{transform:translateY(0px);}
}
`;
}

if(name=="pulse"){
return `
@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.15);}
100%{transform:scale(1);}
}
`;
}

if(name=="rotate"){
return `
@keyframes rotate{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}
`;
}

if(name=="bounce"){
return `
@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-80px);}
}
`;
}

if(name=="shake"){
return `
@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-20px);}
50%{transform:translateX(20px);}
75%{transform:translateX(-20px);}
100%{transform:translateX(0);}
}
`;
}

if(name=="flip"){
return `
@keyframes flip{
0%{transform:rotateY(0deg);}
100%{transform:rotateY(360deg);}
}
`;
}

if(name=="scale"){
return `
@keyframes scale{
0%{transform:scale(.5);}
100%{transform:scale(1.2);}
}
`;
}

if(name=="swing"){
return `
@keyframes swing{
0%{transform:rotate(0deg);}
25%{transform:rotate(15deg);}
50%{transform:rotate(-15deg);}
75%{transform:rotate(10deg);}
100%{transform:rotate(0deg);}
}
`;
}

if(name=="wiggle"){
return `
@keyframes wiggle{
0%{transform:rotate(0deg);}
25%{transform:rotate(5deg);}
50%{transform:rotate(-5deg);}
75%{transform:rotate(3deg);}
100%{transform:rotate(0deg);}
}
`;
}

if(name=="heartbeat"){
return `
@keyframes heartbeat{
0%{transform:scale(1);}
25%{transform:scale(1.2);}
40%{transform:scale(1);}
60%{transform:scale(1.25);}
100%{transform:scale(1);}
}
`;
}

if(name=="slideLeft"){
return `
@keyframes slideLeft{
0%{
transform:translateX(300px);
opacity:0;
}
100%{
transform:translateX(0);
opacity:1;
}
}
`;
}

if(name=="slideRight"){
return `
@keyframes slideRight{
0%{
transform:translateX(-300px);
opacity:0;
}
100%{
transform:translateX(0);
opacity:1;
}
}
`;
}

if(name=="slideUp"){
return `
@keyframes slideUp{
0%{
transform:translateY(300px);
opacity:0;
}
100%{
transform:translateY(0);
opacity:1;
}
}
`;
}

if(name=="slideDown"){
return `
@keyframes slideDown{
0%{
transform:translateY(-300px);
opacity:0;
}
100%{
transform:translateY(0);
opacity:1;
}
}
`;
}

if(name=="zoomIn"){
return `
@keyframes zoomIn{
0%{
transform:scale(0);
opacity:0;
}
100%{
transform:scale(1);
opacity:1;
}
}
`;
}

if(name=="zoomOut"){
return `
@keyframes zoomOut{
0%{
transform:scale(1.5);
opacity:0;
}
100%{
transform:scale(1);
opacity:1;
}
}
`;
}

if(name=="blurIn"){
return `
@keyframes blurIn{
0%{
filter:blur(30px);
opacity:0;
transform:scale(1.3);
}
100%{
filter:blur(0);
opacity:1;
transform:scale(1);
}
}
`;
}

if(name=="glow"){
return `
@keyframes glow{
0%{
box-shadow:0 0 10px #00e5ff;
}
50%{
box-shadow:0 0 50px #ff00cc;
}
100%{
box-shadow:0 0 10px #00e5ff;
}
}
`;
}

if(name=="tilt"){
return `
@keyframes tilt{
0%{
transform:perspective(400px) rotateX(0deg);
}
50%{
transform:perspective(400px) rotateX(25deg);
}
100%{
transform:perspective(400px) rotateX(0deg);
}
}
`;
}

if(name=="spinScale"){
return `
@keyframes spinScale{
0%{
transform:rotate(0deg) scale(1);
}
50%{
transform:rotate(180deg) scale(1.4);
}
100%{
transform:rotate(360deg) scale(1);
}
}
`;
}

if(name=="elastic"){
return `
@keyframes elastic{
0%{transform:scale(1);}
30%{transform:scale(1.3,.7);}
50%{transform:scale(.7,1.3);}
70%{transform:scale(1.2,.8);}
100%{transform:scale(1);}
}
`;
}

if(name=="floatRotate"){
return `
@keyframes floatRotate{
0%{
transform:translateY(0) rotate(0deg);
}
50%{
transform:translateY(-40px) rotate(180deg);
}
100%{
transform:translateY(0) rotate(360deg);
}
}
`;
}

if(name=="neonPulse"){
return `
@keyframes neonPulse{
0%{filter:brightness(1);}
50%{filter:brightness(2);}
100%{filter:brightness(1);}
}
`;
}

if(name=="skew"){
return `
@keyframes skew{
0%{transform:skew(0deg);}
25%{transform:skew(10deg);}
50%{transform:skew(-10deg);}
100%{transform:skew(0deg);}
}
`;
}

if(name=="wave"){
return `
@keyframes wave{
0%{border-radius:35px;}
50%{border-radius:60% 40% 30% 70%;}
100%{border-radius:35px;}
}
`;
}

if(name=="fadeIn"){
return `
@keyframes fadeIn{
0%{opacity:0;}
100%{opacity:1;}
}
`;
}

if(name=="fadeOut"){
return `
@keyframes fadeOut{
0%{opacity:1;}
100%{opacity:0;}
}
`;
}

if(name=="matrix"){
return `
@keyframes matrix{
0%{
transform:translateY(-200px);
opacity:0;
}
100%{
transform:translateY(200px);
opacity:1;
}
}
`;
}

if(name=="portal"){
return `
@keyframes portal{
0%{
transform:rotate(0deg) scale(.2);
opacity:0;
}
100%{
transform:rotate(720deg) scale(1);
opacity:1;
}
}
`;
}

if(name=="levitate"){
return `
@keyframes levitate{
0%{
transform:translateY(0) scale(1);
}
50%{
transform:translateY(-60px) scale(1.08);
}
100%{
transform:translateY(0) scale(1);
}
}
`;
}

}



function updateAnimation(){

durationText.innerText=duration.value+"s";

delayText.innerText=delay.value+"s";

let name=animation.value;

let keyframes=getKeyframes(name);

dynamicStyle.innerHTML=keyframes;

object.style.animation=`
${name}
${duration.value}s
${easing.value}
${delay.value}s
${iteration.value}
`;

rawCSS=`
.object{
animation:${name} ${duration.value}s ${easing.value} ${delay.value}s ${iteration.value};
}

${keyframes}
`;

highlightCSS(rawCSS);

}

[
animation,
duration,
delay,
iteration,
easing
].forEach(e=>{

e.addEventListener("input",updateAnimation);

});

play.addEventListener("click",()=>{

object.style.animation="none";

setTimeout(()=>{

updateAnimation();

},20);

});

copy.addEventListener("click",()=>{

navigator.clipboard.writeText(rawCSS);

copy.innerText="Copiado";

setTimeout(()=>{

copy.innerText="Copiar";

},1500);

});

document.querySelectorAll(".preset").forEach(e=>{

e.addEventListener("click",()=>{

animation.value=e.dataset.animation;

updateAnimation();

});

});

updateAnimation();
</script>

</body>
</html>
