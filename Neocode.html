<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Neo-code</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:
"Inter",
system-ui,
sans-serif;
}

/* ===== BODY ===== */

body{

display:grid;

grid-template-columns:
220px
1fr
320px;

grid-template-rows:
80px
1fr
320px;

height:100vh;

background:
radial-gradient(
circle at top,
#111827,
#050816
);

color:#fff;

gap:14px;
padding:14px;

overflow:hidden;

}

/* ===== HEADER ===== */

.header{

grid-column:1/4;

display:flex;
align-items:center;
justify-content:center;
gap:16px;

border-radius:22px;

background:
linear-gradient(
135deg,
rgba(19,26,45,.95),
rgba(8,12,24,.95)
);

border:
1px solid rgba(255,255,255,.06);

box-shadow:
0 10px 40px rgba(0,0,0,.45);

overflow:hidden;

}



.titulo{

font-size:34px;
font-weight:800;

background:
linear-gradient(
135deg,
#7dd3fc,
#34d399
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

/* ===== PANELS ===== */

.panel{

background:
linear-gradient(
180deg,
rgba(17,24,39,.92),
rgba(5,8,22,.96)
);

border-radius:22px;

padding:18px;

border:
1px solid rgba(255,255,255,.06);

box-shadow:
0 12px 40px rgba(0,0,0,.45);

overflow:auto;

}

/* ===== TITLES ===== */

h3{

font-size:14px;

margin:
18px 0 12px;

padding-bottom:10px;

text-align:center;

letter-spacing:2px;

font-weight:700;

color:#7dd3fc;

border-bottom:
1px solid rgba(125,211,252,.25);

text-transform:uppercase;

}

/* ===== INFO ===== */

.infoMover{

padding:12px;

margin-bottom:14px;

border-radius:14px;

font-size:13px;
text-align: center;
font-weight: bolder;

line-height:1.5;

background:
rgba(56,189,248,.08);

border:
1px solid rgba(56,189,248,.18);

color:#7dd3fc;

}

/* ===== BUTTONS ===== */

button{

width:100%;

padding:12px;

margin-bottom:10px;

border:none;
border-radius:14px;

cursor:pointer;

font-size:15px;
font-weight:700;

color:#fff;

background:
linear-gradient(
135deg,
#0f172a,
#1e293b
);

border:
1px solid rgba(255,255,255,.08);

transition:.22s;

}

button:hover{

transform:
translateY(-2px)
scale(1.01);

box-shadow:
0 10px 25px rgba(52,211,153,.18);

border:
1px solid rgba(52,211,153,.35);

}

/* ===== INPUTS ===== */

input,
select{

width:100%;

margin-bottom:10px;

padding:10px 12px;

border-radius:12px;

background:
rgba(15,23,42,.85);

color:#fff;

border:
1px solid rgba(255,255,255,.08);

}

/* ===== CANVAS ===== */

#canvas{

background:
linear-gradient(
135deg,
#0f172a,
#111827
);

position:relative;

border-radius:24px;

border:
1px solid rgba(255,255,255,.06);

overflow:hidden;

box-shadow:
inset 0 0 50px rgba(0,0,0,.35),
0 20px 50px rgba(0,0,0,.45);

}

/* ===== CODE ===== */

#codigos{

grid-column:1/4;

display:grid;

grid-template-columns:1fr 1fr;

gap:14px;

}

pre{

position:relative;

padding:
58px 22px 22px 22px;

border-radius:24px;

overflow:auto;

font-size:15px;
line-height:1.75;

white-space:pre-wrap;

font-family:
"JetBrains Mono",
monospace;

background:
linear-gradient(
180deg,
#0b1120,
#050816
);

border:
1px solid rgba(255,255,255,.06);

box-shadow:
0 20px 40px rgba(0,0,0,.45);

}

#html::before{

content:"HTML";

position:absolute;

top:16px;
left:18px;

padding:
6px 12px;

border-radius:999px;

font-size:12px;
font-weight:800;

background:
linear-gradient(
135deg,
#34d399,
#10b981
);

color:#04130e;

}

#css::before{

content:"CSS";

position:absolute;

top:16px;
left:18px;

padding:
6px 12px;

border-radius:999px;

font-size:12px;
font-weight:800;

background:
linear-gradient(
135deg,
#60a5fa,
#38bdf8
);

color:#03111f;

}

#html{
color:#6ee7b7;
}

#css{
color:#7dd3fc;
}

/* ===== ELEMENTOS ===== */

.el{

position:absolute;

min-width:40px;
min-height:30px;

cursor:move;

padding:4px;

transition:
outline .15s,
box-shadow .15s;

user-select:none;

}

.el .el{
z-index:5;
}

.activo{

z-index:999 !important;

outline:
2px solid #38bdf8;

box-shadow:
0 0 20px rgba(56,189,248,.35);

}

.el img{

width:100%;
height:100%;

object-fit:cover;

pointer-events:none;

border-radius:inherit;

}

.resizer{

position:absolute;

width:14px;
height:14px;

right:-7px;
bottom:-7px;

cursor:se-resize;

border-radius:6px;

background:
linear-gradient(
135deg,
#34d399,
#38bdf8
);

z-index:9999;

}

/* ===== SCROLL ===== */

::-webkit-scrollbar{
width:8px;
height:8px;
}

::-webkit-scrollbar-thumb{

background:
linear-gradient(
180deg,
#34d399,
#38bdf8
);

border-radius:999px;

}
.logo{

width:62px;
height:62px;

display:flex;
align-items:center;
justify-content:center;

border-radius:14px;





overflow:hidden;

}
.logo img{

width:100%;
height:100%;

object-fit:cover;

display:block;

}

</style>
<link rel="icon" href="neocode.png" sizes="192x192">

</head>

<body>

<div class="header">

<div class="logo">
  <img src="logo.png" >
</div>

<div class="titulo">
Neo-code
</div>

</div>

<!-- LEFT -->

<div class="panel">

<h3>Elementos</h3>

<button onclick="crear('div')">
▣ DIV
</button>

<button onclick="crear('h1')">
🔠 H1
</button>

<button onclick="crear('p')">
🅿 P
</button>

<button onclick="crear('img')">
🖼 IMG
</button>

<button onclick="crear('section')">
📝 SECTION
</button>

<button onclick="crear('article')">
📖 ARTICLE
</button>

<h3>Jerarquía</h3>

<div class="infoMover">

Selecciona un elemento y usa
las flechas del teclado para
mover hijos dentro de otros
agrupadores.

</div>

<button onclick="crearDentro('div')">
📦 DIV hijo
</button>

<button onclick="crearDentro('p')">
📝 P hijo
</button>

<button onclick="crearDentro('img')">
🖼 IMG hijo
</button>

</div>

<!-- CANVAS -->

<div id="canvas"></div>

<!-- RIGHT -->

<div class="panel">

<h3>Colores</h3>

BG
<input type="color" id="bg">

Color
<input type="color" id="color">

<h3>Texto</h3>

Align

<select id="ta">

<option value="left">
left
</option>

<option value="center">
center
</option>

<option value="right">
right
</option>

<option value="justify">
justify
</option>

</select>

<h3>Tipografía</h3>

Font Size

<input
type="range"
min="10"
max="80"
id="fs"
>

<h3>Bordes</h3>

Border Width

<input
type="range"
min="0"
max="10"
id="bw"
>

Border Radius

<input
type="range"
min="0"
max="50"
id="br"
>

Border Color

<input
type="color"
id="bc"
>

Border Style

<select id="bs">

<option value="solid">
solid
</option>

<option value="dashed">
dashed
</option>

<option value="dotted">
dotted
</option>

<option value="double">
double
</option>

</select>

<button onclick="eliminar()">
Eliminar
</button>

</div>

<!-- CODIGOS -->

<div id="codigos">

<pre id="html"></pre>

<pre id="css"></pre>

</div>

<script>

const canvas=
document.getElementById(
"canvas"
)

let estado={elementos:[]}

let activo=null

let contador=0

let imgCount=1

const imagenesPrueba=[

"https://picsum.photos/200/150?random=1",
"https://picsum.photos/200/150?random=2",
"https://picsum.photos/200/150?random=3"

]

function crear(tipo,padre=null){

let clase="c"+(++contador)

let obj={

clase,

tipo,

padre,

hijos:[],

texto:
tipo=="h1"
?"Titulo"
:tipo=="p"
?"Texto de ejemplo"
:"",

estilos:{

top:50,
left:50,

width:200,
height:120,

background:"#1e293b",

color:"#ffffff",

fs:16,

ta:"left",

bw:1,

br:8,

bc:"#38bdf8",

bs:"solid"

}

}

if(tipo=="img"){

obj.nombre=
"imagen"+imgCount+".png"

obj.src=
imagenesPrueba[
(imgCount-1)%imagenesPrueba.length
]

imgCount++

}

estado.elementos.push(obj)

if(padre){

let padreObj=
estado.elementos.find(
x=>x.clase==padre
)

if(padreObj){

padreObj.hijos.push(clase)

}

}

render()

}

function crearDentro(tipo){

if(!activo)return

crear(tipo,activo)

}

function render(){

canvas.innerHTML=""

let raiz=
estado.elementos.filter(
e=>!e.padre
)

raiz.forEach(e=>{

canvas.appendChild(
renderElemento(e)
)

})

generarCodigo()

}

function renderElemento(e){

let el=
document.createElement("div")

el.className=
"el "+
e.clase+
(activo==e.clase
?" activo":"")

el.dataset.clase=e.clase

if(e.tipo=="img"){

let img=
document.createElement("img")

img.src=e.src

el.appendChild(img)

}

else if(
["h1","p"]
.includes(e.tipo)
){

let txt=
document.createElement(e.tipo)

txt.textContent=e.texto

txt.ondblclick=ev=>{

ev.stopPropagation()

txt.contentEditable=true

txt.focus()

}

txt.onblur=()=>{

txt.contentEditable=false

e.texto=txt.textContent

generarCodigo()

}

el.appendChild(txt)

}

aplicarEstilos(el,e)

el.onclick=ev=>{

ev.stopPropagation()

activo=e.clase

cargarProps()

render()

}

el.onmousedown=eve=>{

if(
eve.target.classList.contains(
"resizer"
)
)return

dragStart(eve)

}

let r=
document.createElement("div")

r.className="resizer"

r.onmousedown=resizeStart

el.appendChild(r)

e.hijos.forEach(h=>{

let hijo=
estado.elementos.find(
x=>x.clase==h
)

if(hijo){

el.appendChild(
renderElemento(hijo)
)

}

})

return el

}

function aplicarEstilos(el,e){

let s=e.estilos

el.style.top=s.top+"px"

el.style.left=s.left+"px"

el.style.width=s.width+"px"

el.style.height=s.height+"px"

if(
!["h1","p"]
.includes(e.tipo)
){

el.style.background=
s.background

}

if(e.tipo!="img"){

el.style.color=s.color

el.style.fontSize=
s.fs+"px"

el.style.textAlign=s.ta

}

el.style.border=
s.bw+
"px "+
s.bs+
" "+
s.bc

el.style.borderRadius=
s.br+"px"

}

function cargarProps(){

let e=
estado.elementos.find(
x=>x.clase==activo
)

if(!e)return

bg.value=e.estilos.background
color.value=e.estilos.color
fs.value=e.estilos.fs
ta.value=e.estilos.ta
bw.value=e.estilos.bw
br.value=e.estilos.br
bc.value=e.estilos.bc
bs.value=e.estilos.bs

}

document
.querySelectorAll(
"input,select"
)
.forEach(i=>{

i.oninput=()=>{

let e=
estado.elementos.find(
x=>x.clase==activo
)

if(!e)return

e.estilos.background=bg.value
e.estilos.color=color.value
e.estilos.fs=+fs.value
e.estilos.ta=ta.value
e.estilos.bw=+bw.value
e.estilos.br=+br.value
e.estilos.bc=bc.value
e.estilos.bs=bs.value

render()

}

})

function eliminar(){

estado.elementos=
estado.elementos.filter(
e=>e.clase!=activo
)

estado.elementos.forEach(e=>{

e.hijos=
e.hijos.filter(
h=>h!=activo
)

})

activo=null

render()

}

canvas.onclick=()=>{

activo=null

render()

}

/* ===== FLECHAS ===== */

document.addEventListener(
"keydown",
e=>{

if(!activo)return

let obj=
estado.elementos.find(
x=>x.clase==activo
)

if(!obj)return

let paso=5

if(e.key=="ArrowUp"){

obj.estilos.top-=paso

}

else if(e.key=="ArrowDown"){

obj.estilos.top+=paso

}

else if(e.key=="ArrowLeft"){

obj.estilos.left-=paso

}

else if(e.key=="ArrowRight"){

obj.estilos.left+=paso

}

else{

return

}

e.preventDefault()

render()

})

/* ===== DRAG ===== */

let offsetX
let offsetY
let dragging=null

function dragStart(e){

if(e.target.isContentEditable)
return

dragging=
e.currentTarget.dataset.clase

offsetX=e.offsetX
offsetY=e.offsetY

document.onmousemove=
dragMove

document.onmouseup=
dragEnd

}

function dragMove(e){

if(!dragging)return

let obj=
estado.elementos.find(
x=>x.clase==dragging
)

obj.estilos.left=
e.pageX-
canvas.offsetLeft-
offsetX

obj.estilos.top=
e.pageY-
canvas.offsetTop-
offsetY

render()

}

function dragEnd(){

dragging=null

document.onmousemove=null

}

/* ===== RESIZE ===== */

let resizing=null
let startX
let startY
let startW
let startH

function resizeStart(e){

e.stopPropagation()

resizing=
e.target.parentElement.dataset.clase

let obj=
estado.elementos.find(
x=>x.clase==resizing
)

startX=e.pageX
startY=e.pageY

startW=obj.estilos.width
startH=obj.estilos.height

document.onmousemove=
resizeMove

document.onmouseup=
resizeEnd

}

function resizeMove(e){

if(!resizing)return

let obj=
estado.elementos.find(
x=>x.clase==resizing
)

obj.estilos.width=
Math.max(
40,
startW+
(e.pageX-startX)
)

obj.estilos.height=
Math.max(
30,
startH+
(e.pageY-startY)
)

render()

}

function resizeEnd(){

resizing=null

document.onmousemove=null

}

/* ===== HTML ===== */

function generarHTML(e,nivel=0){

let tab="    ".repeat(nivel)

let htmlCode=""

if(e.tipo=="img"){

htmlCode+=
`${tab}<img class="${e.clase}" src="${e.nombre}">\n`

}

else{

htmlCode+=
`${tab}<${e.tipo} class="${e.clase}">`

if(e.texto){

htmlCode+=`\n`

htmlCode+=
`${tab}    ${e.texto}\n`

}

if(e.hijos.length>0){

htmlCode+=`\n`

e.hijos.forEach(h=>{

let hijo=
estado.elementos.find(
x=>x.clase==h
)

if(hijo){

htmlCode+=
generarHTML(
hijo,
nivel+1
)

}

})

htmlCode+=`${tab}`

}

htmlCode+=
`</${e.tipo}>\n`

}

return htmlCode

}

/* ===== CODIGO ===== */

function generarCodigo(){

let htmlCode=""
let cssCode=""

let raiz=
estado.elementos.filter(
e=>!e.padre
)

raiz.forEach(e=>{

htmlCode+=
generarHTML(e)

})

estado.elementos.forEach(e=>{

cssCode+=
`.${e.clase}{\n`

cssCode+=
`  position:absolute;\n`

cssCode+=
`  top:${e.estilos.top}px;\n`

cssCode+=
`  left:${e.estilos.left}px;\n`

cssCode+=
`  width:${e.estilos.width}px;\n`

cssCode+=
`  height:${e.estilos.height}px;\n`

if(
!["h1","p"]
.includes(e.tipo)
){

cssCode+=
`  background:${e.estilos.background};\n`

}

if(e.tipo!="img"){

cssCode+=
`  color:${e.estilos.color};\n`

cssCode+=
`  font-size:${e.estilos.fs}px;\n`

cssCode+=
`  text-align:${e.estilos.ta};\n`

}

cssCode+=
`  border:${e.estilos.bw}px ${e.estilos.bs} ${e.estilos.bc};\n`

cssCode+=
`  border-radius:${e.estilos.br}px;\n`

cssCode+=`}\n\n`

})

html.textContent=htmlCode

css.textContent=cssCode

}

render()

</script>

</body>
</html>
